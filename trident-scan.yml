# Example GitHub Actions workflow for repositories using the Trident CLI.
#
# The package must be available from the public package index before enabling
# this workflow. It reports confirmed findings as SARIF and preserves the
# distinct exit codes: 0 clean, 1 findings, 2 scan error.

name: Trident Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Fail if a finding is at or above this tier (P0-P4)"
        required: false
        default: P1
        type: choice
        options: [P0, P1, P2, P3, P4]

permissions:
  contents: read
  security-events: write

jobs:
  trident-scan:
    name: Trident scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Trident
        run: python -m pip install trident

      - name: Install scanner tools
        run: trident install-tools

      - name: Scan
        id: scan
        run: trident scan . --format sarif --output-file trident-results.sarif --fail-on "${{ inputs.fail_on || 'P1' }}"
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trident-results.sarif') != ''
        with:
          sarif_file: trident-results.sarif
          category: trident

      - name: Fail on findings or scan errors
        if: steps.scan.outcome == 'failure'
        run: |
          echo "Trident returned a non-zero scan status."
          echo "Review the SARIF artifact and scan logs."
          exit 1
