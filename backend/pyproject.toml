[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trident"
dynamic = ["version"]
description = "AI-assisted command-line code security scanner and triage engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "loguru>=0.7",
    "click>=8.4.2,<8.5",
    "platformdirs>=4.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "rich>=13.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
scanner-tools = [
    "semgrep>=1.0",
    "bandit>=1.7",
    "checkov>=3.0",
    "pip-audit>=2.0",
]
reports = ["reportlab>=4.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
trident = "trident.cli:cli"

[tool.setuptools.dynamic]
version = {attr = "trident.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["trident*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (real bugs: unused imports/vars, undefined names, etc.) + syntax
# errors. Deliberately not the stricter opinionated rule families (style,
# blind-except, string-concat, ...) — those would flag ~250 mostly-intentional
# patterns in this codebase (e.g. broad except around third-party tool output)
# without catching more real bugs. Widen later if desired, as its own change.
select = ["E9", "F"]
