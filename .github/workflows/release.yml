name: Release CLI package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish, for example v0.3.2"
        required: true
        type: string
      source_sha:
        description: "Exact commit already tagged and approved for publication"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH to authorize the public GitHub release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build and verify package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "${CONFIRM}" = "PUBLISH"
          test "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch --tags --force
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${SOURCE_SHA}"
          PACKAGE_VERSION="$(python -c 'from trident import __version__; print(__version__)')"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
          VERSION="${RELEASE_TAG#v}"
          test -f "${GITHUB_WORKSPACE}/.github/releases/${VERSION}.md"

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl

      - name: Smoke-test installed CLI
        run: |
          .release-venv/bin/trident --version
          .release-venv/bin/trident --help
          .release-venv/bin/trident scan --help
          .release-venv/bin/trident scan --help | grep -q -- '--triage-output-file'
          .release-venv/bin/trident config --help
          .release-venv/bin/trident model --help
          .release-venv/bin/trident install-tools --check

      - name: Upload distributions to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: trident-cli-package
          path: backend/dist/*

      - name: Create GitHub release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NOTES_FILE="${GITHUB_WORKSPACE}/.github/releases/${VERSION}.md"
          test -f "${NOTES_FILE}"
          gh release create "${RELEASE_TAG}" dist/* --notes-file "${NOTES_FILE}" --verify-tag
