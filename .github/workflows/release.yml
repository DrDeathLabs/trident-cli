name: Release CLI package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build and verify package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'from trident import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl

      - name: Smoke-test installed CLI
        run: |
          .release-venv/bin/trident --version
          .release-venv/bin/trident --help
          .release-venv/bin/trident scan --help
          .release-venv/bin/trident scan --help | grep -q -- '--triage-output-file'
          .release-venv/bin/trident config --help
          .release-venv/bin/trident model --help
          .release-venv/bin/trident install-tools --check

      - name: Upload distributions to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: trident-cli-package
          path: backend/dist/*

      - name: Create GitHub release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" backend/dist/* --generate-notes --verify-tag
