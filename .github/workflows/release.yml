name: Release CLI package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish, for example v0.3.3"
        required: true
        type: string
      source_sha:
        description: "Exact commit already tagged and approved for publication"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH to authorize the public GitHub release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build and verify package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Verify approved tag, source, version, and notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          PACKAGE_VERSION="$(python -c 'from trident import __version__; print(__version__)')"
          python ../scripts/verify_release_candidate.py \
            --tag "${RELEASE_TAG}" \
            --source-sha "${SOURCE_SHA}" \
            --confirm "${CONFIRM}" \
            --package-version "${PACKAGE_VERSION}" \
            --notes-root "${GITHUB_WORKSPACE}/.github/releases"

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl

      - name: Smoke-test installed CLI
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: |
          .release-venv/bin/trident --version
          test "$(.release-venv/bin/trident --version)" = "trident, version ${RELEASE_VERSION#v}"
          .release-venv/bin/trident --help
          .release-venv/bin/trident scan --help
          .release-venv/bin/trident scan --help | grep -q -- '--triage-output-file'
          .release-venv/bin/trident config --help
          .release-venv/bin/trident model --help
          .release-venv/bin/trident install-tools --check

      - name: Upload distributions to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: trident-cli-package
          path: backend/dist/*

      - name: Create GitHub release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="${GITHUB_WORKSPACE}/.github/releases/${RELEASE_VERSION#v}.md"
          test -f "${NOTES_FILE}"
          gh release create "${RELEASE_TAG}" dist/* --notes-file "${NOTES_FILE}" --verify-tag
